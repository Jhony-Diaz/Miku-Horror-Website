
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Miku Test</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #b5ece9;
    }
    canvas {
      display: block;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { VRMLoaderPlugin } from "@pixiv/three-vrm";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      30,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 1.2, 5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(1, 2, 3);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));

    const loader = new GLTFLoader();
    loader.register(parser => new VRMLoaderPlugin(parser));

    let miku;

    loader.load(
      "./models/miku.vrm",
      gltf => {
        miku = gltf.userData.vrm;
        // The model loaded facing away from the camera.
        miku.scene.rotation.y = Math.PI;
        scene.add(miku.scene);
        prepareWave();
        console.log("Miku loaded!");
      },
      undefined,
      error => console.error("Miku failed to load:", error)
    );

    const clock = new THREE.Clock();

    // The waving bones are looked up once, after Miku loads.
    let upperArm, lowerArm;
    function prepareWave() {
      upperArm = miku.humanoid.getNormalizedBoneNode("rightUpperArm");
      lowerArm = miku.humanoid.getNormalizedBoneNode("rightLowerArm");
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      if (miku) {
        const time = clock.elapsedTime;

        // Hold her right arm up, with a small repeating wave.
        if (upperArm) {
          upperArm.rotation.z = -1.05;
          upperArm.rotation.x = 0.15;
        }
        if (lowerArm) {
          lowerArm.rotation.z = -0.45 + Math.sin(time * 5) * 0.28;
        }
        miku.update(delta);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
